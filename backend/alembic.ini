[alembic]
script_location = migrations
prepend_sys_path = .
# path_separator stops Alembic 1.20 falling back to splitting on spaces and
# commas, which mangles a Windows path.
path_separator = os
# sqlalchemy.url is deliberately NOT set here. app/migrations.py fills it in
# from application settings (or TEST_DATABASE_URL), so there is only ever one
# source of truth for the database URL and it can never silently go stale.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
