[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-docs-architect-backend"
version = "0.1.0"
description = "Backend for Gaia Docs Architect"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]",
    "pydantic-settings",
    "python-multipart",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
# pytest-asyncio is required by the async test modules; pytest-timeout keeps a
# hung request from stalling the whole suite.
dev = ["pytest", "pytest-asyncio", "httpx", "pytest-timeout"]
# The desktop shell (scripts\desktop.py). Kept optional so a server-only
# deployment never pulls in a GUI toolkit and its webview bindings.
desktop = ["pywebview>=5.0"]

[tool.setuptools]
# Declared explicitly rather than left to flat-layout auto-discovery. The
# backend root holds two importable-looking directories -- the `app` package and
# the Alembic `migrations` directory, which is scripts, not a package -- and
# setuptools refuses to guess between them. Naming the one real package keeps
# `pip install -e ./backend` working.
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The PostgreSQL integration suite is marked 'postgres' and only runs when
# TEST_DATABASE_URL is set. SQLite unit tests are the default so that the
# suite still works with no database server present.
markers = [
    "postgres: requires a live PostgreSQL server (set TEST_DATABASE_URL)",
]
