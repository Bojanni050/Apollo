[project]
name = "gaia-docs-architect-backend"
version = "0.1.0"
description = "Backend for Gaia Docs Architect"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]",
    "pydantic-settings",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pytest-timeout"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The PostgreSQL integration suite is marked 'postgres' and only runs when
# TEST_DATABASE_URL is set. SQLite unit tests are the default so that the
# suite still works with no database server present.
markers = [
    "postgres: requires a live PostgreSQL server (set TEST_DATABASE_URL)",
]
