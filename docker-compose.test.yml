# Disposable PostgreSQL for the integration test suite.
#
#   docker compose -f docker-compose.test.yml up -d
#   cd backend
#   set TEST_DATABASE_URL=postgresql+psycopg://gaia:gaia@127.0.0.1:55433/gaia_docs_test
#   python -m pytest -m postgres
#   docker compose -f docker-compose.test.yml down -v
#
# The credentials here are throwaway test values for a container that only ever
# listens on localhost. They are NOT the application's database credentials --
# those live in DATABASE_URL and must come from the environment.
#
# A different port (55433) is used deliberately so this can never collide with a
# PostgreSQL already running on the standard 5432.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: apollo-pg-test
    environment:
      POSTGRES_USER: gaia
      POSTGRES_PASSWORD: gaia
      POSTGRES_DB: gaia_docs_test
      # Deterministic collation, so ordering behaviour is identical on every
      # machine and a test cannot pass locally but fail in CI.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      # The data directory lives in RAM: this database is disposable, and
      # tmpfs keeps the suite fast and leaves nothing behind on the host.
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=50
    healthcheck:
      # `pg_isready` alone succeeds before the database accepts real
      # connections; the explicit SELECT is what actually matters.
      test: ["CMD-SHELL", "pg_isready -U gaia -d gaia_docs_test && psql -U gaia -d gaia_docs_test -c 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
